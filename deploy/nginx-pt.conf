# 서버에 이미 nginx가 있을 때 (예: rest-wifi.co.kr이 nginx로 운영 중)
# 1) 이 파일을 /etc/nginx/sites-available/pt.conf 로 복사하고 server_name을 바꾼 뒤
# 2) sudo ln -s /etc/nginx/sites-available/pt.conf /etc/nginx/sites-enabled/
# 3) sudo certbot --nginx -d pt.rest-wifi.co.kr   (HTTPS 인증서)
# 4) sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name pt.rest-wifi.co.kr;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
