<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · PT 관리</title>
    <style>
      body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; color: #18181b; background: #fff; }
      .bar { background: #f97316; color: #fff; padding: 6px; position: fixed; top: 0; left: 0; right: 0; font-size: 14px; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #ededed; } }
    </style>
  </head>
  <body>
    <div class="bar">오프라인</div>
    <h1>연결할 수 없습니다</h1>
    <p>이 화면은 아직 휴대폰에 저장되지 않았습니다. 연결되면 다시 열어 주세요.</p>
    <p>자동 로그인한 기기에서 한 번 열어 둔 화면은 오프라인에서도 볼 수 있습니다.</p>
  </body>
